# nav2 for the Go2, ported from tmms_master's nav2_params.yaml.
# Frames: map (AMCL) -> odom -> base_footprint (goaway_odometry, floor under the robot) -> base_link.
# Obstacles: /utlidar/cloud_obstacles (each L1 message cut to the scan band in base_footprint by
# cloud_accumulator, see goaway_scan.yaml) for the costmaps, /utlidar/scan for AMCL and the
# collision monitor. The L1 can't see the rear ~90 deg or above its own height to the sides.

amcl:
  ros__parameters:
    # Stock motion noise; alpha5 is the omni term
    alpha1: 0.2
    alpha2: 0.2
    alpha3: 0.2
    alpha4: 0.2
    alpha5: 0.2
    base_frame_id: "base_footprint"
    odom_frame_id: "odom"
    global_frame_id: "map"
    # The Go2 strafes
    robot_model_type: "nav2_amcl::OmniMotionModel"
    scan_topic: /utlidar/scan
    # range_max of /utlidar/scan; -1 = the scan's own range_min
    laser_max_range: 8.0
    laser_min_range: -1.0
    laser_model_type: "likelihood_field"
    laser_likelihood_max_dist: 2.0
    # nav2 defaults (tmms: 300 beams, 5000 particles): on a blank map the cloud spreads to the
    # maximum and AMCL fell behind (map -> odom gaps of seconds). Retune with a real map.
    max_beams: 60
    beam_skip_distance: 0.5
    beam_skip_error_threshold: 0.9
    beam_skip_threshold: 0.3
    do_beamskip: false
    lambda_short: 0.1
    sigma_hit: 0.2
    z_hit: 0.9
    z_max: 0.05
    z_rand: 0.1
    z_short: 0.1
    max_particles: 2000
    min_particles: 500
    pf_err: 0.05
    pf_z: 0.99
    recovery_alpha_fast: 0.0
    recovery_alpha_slow: 0.0
    resample_interval: 1
    update_min_a: 0.05
    update_min_d: 0.05
    # Seeds (0,0,0) at activation so map -> odom exists at boot (with the startup map), else the
    # navigation half aborts after 60 s. The pose means nothing until /initialpose on a real map.
    set_initial_pose: true
    save_pose_rate: 0.5
    tf_broadcast: true
    transform_tolerance: 1.0

bt_navigator:
  ros__parameters:
    global_frame: map
    robot_base_frame: base_footprint
    odom_topic: /odom
    bt_loop_duration: 10
    default_server_timeout: 20
    wait_for_service_timeout: 1000
    action_server_result_timeout: 900.0
    navigators: ["navigate_to_pose", "navigate_through_poses"]
    navigate_to_pose:
      plugin: "nav2_bt_navigator::NavigateToPoseNavigator"
    navigate_through_poses:
      plugin: "nav2_bt_navigator::NavigateThroughPosesNavigator"
    # tmms's trees: replan only on a new goal, an invalid path, or every 10 s
    default_nav_to_pose_bt_xml: "$(find-pkg-share goaway_master)/config/nav_to_pose_with_consistent_replanning_and_if_path_becomes_invalid.xml"
    default_nav_through_poses_bt_xml: "$(find-pkg-share goaway_master)/config/nav_through_poses_with_consistent_replanning_and_if_path_becomes_invalid.xml"
    error_code_names:
      - compute_path_error_code
      - follow_path_error_code

controller_server:
  ros__parameters:
    # 10 Hz and 10/5/10 samples (tmms: 20 Hz, 20/10/20): the Go2 shares its CPU with the walk
    controller_frequency: 10.0
    costmap_update_timeout: 0.30
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    progress_checker_plugins: ["progress_checker"]
    goal_checker_plugins: ["general_goal_checker"]
    controller_plugins: ["FollowPath"]
    use_realtime_priority: false

    progress_checker:
      plugin: "nav2_controller::PoseProgressChecker"
      required_movement_radius: 0.2
      required_movement_angle: 0.2
      movement_time_allowance: 15.0
      # Patched in our nav2: no timeout while paused, the allowance restarts on unpause
      pause_status_topic: /quadruped_main_status
    general_goal_checker:
      stateful: True
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.25
      yaw_goal_tolerance: 0.25
    FollowPath:
      plugin: "dwb_core::DWBLocalPlanner"
      # prune_distance must not exceed forward_prune_distance ("plan has 0 poses")
      forward_prune_distance: 1.0
      prune_distance: 1.0
      debug_trajectory_details: False
      min_vel_x: 0.0      # no reversing: the L1 can't see behind
      min_vel_y: -0.3
      max_vel_x: 0.5
      max_vel_y: 0.3
      max_vel_theta: 0.8
      min_speed_xy: 0.07
      max_speed_xy: 0.5
      min_speed_theta: 0.1
      acc_lim_x: 3.0
      acc_lim_y: 3.0
      acc_lim_theta: 3.2
      decel_lim_x: -3.0
      decel_lim_y: -3.0
      decel_lim_theta: -3.2
      vx_samples: 10
      vy_samples: 5
      vtheta_samples: 10
      sim_time: 1.7
      linear_granularity: 0.05
      angular_granularity: 0.025
      short_circuit_trajectory_evaluation: True
      limit_vel_cmd_in_traj: False
      critics: ["RotateToGoal", "Oscillation", "PreferForward", "ObstacleFootprint", "GoalAlign", "PathAlign", "PathDist", "GoalDist"]
      ObstacleFootprint.scale: 0.02
      PreferForward.scale: 1.0
      PreferForward.theta_scale: 0.0
      PathAlign.scale: 32.0
      GoalAlign.scale: 24.0
      PathAlign.forward_point_distance: 0.325
      GoalAlign.forward_point_distance: 0.325
      PathDist.scale: 32.0
      GoalDist.scale: 24.0
      RotateToGoal.scale: 32.0
      RotateToGoal.slowing_factor: 5.0
      RotateToGoal.lookahead_time: -1.0

local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: odom
      robot_base_frame: base_footprint
      rolling_window: true
      width: 5
      height: 5
      # Must equal stvl_layer.voxel_size (STVL flattens each voxel column onto one cell).
      # 0.05: the L1 is sparse, finer cells leave holes in walls.
      resolution: 0.05
      # Body + feet (base_link at the centre). Inside the self-filter box (x -0.48..0.45, y +-0.26).
      footprint: "[ [0.38, 0.16], [0.38, -0.16], [-0.34, -0.16], [-0.34, 0.16] ]"
      plugins: ["stvl_layer", "inflation_layer"]
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 0.45
      stvl_layer:
        plugin: "spatio_temporal_voxel_layer/SpatioTemporalVoxelLayer"
        enabled: True
        voxel_size: 0.05                  # = resolution
        # Marks only, they fade by time: each L1 message sees a sliver of the dome, so a frustum
        # clear on it would wipe voxels nothing looked at. A passer-by leaves a ghost this long.
        voxel_decay: 2.0                  # s (linear)
        decay_model: 0                    # 0=linear, 1=exponential, 2=persistent
        mark_threshold: 0
        track_unknown_space: False        # unseen = free
        update_footprint_enabled: True
        combination_method: 1             # 1=max
        publish_voxel_map: True           # PointCloud2 on ~/voxel_grid
        transform_tolerance: 0.5
        mapping_mode: False
        map_save_duration: 60.0
        observation_sources: l1_mark
        l1_mark:
          data_type: PointCloud2
          topic: /utlidar/cloud_obstacles
          marking: True
          clearing: False
          obstacle_range: 2.5             # ~ the half-width of the 5x5 window
          # The band is cut in base_footprint already; STVL's own cut would be level in odom
          filter: "passthrough"
          min_obstacle_height: -10.0
          max_obstacle_height: 10.0
          expected_update_rate: 1.0       # 15 Hz source: stale after 1 s
          observation_persistence: 0.0
          inf_is_valid: False
          voxel_min_points: 0
          clear_after_reading: True
      always_send_full_costmap: True

global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 1.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_footprint
      footprint: "[ [0.38, 0.16], [0.38, -0.16], [-0.34, -0.16], [-0.34, 0.16] ]"
      resolution: 0.05
      track_unknown_space: true
      plugins: ["static_layer", "stvl_layer", "inflation_layer"]
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: True
      stvl_layer:
        plugin: "spatio_temporal_voxel_layer/SpatioTemporalVoxelLayer"
        enabled: True
        voxel_size: 0.05
        voxel_decay: 2.0
        decay_model: 0
        mark_threshold: 0
        track_unknown_space: False        # unknown space is the static layer's
        update_footprint_enabled: True
        combination_method: 1
        publish_voxel_map: True
        transform_tolerance: 0.5
        mapping_mode: False
        map_save_duration: 60.0
        observation_sources: l1_mark
        l1_mark:
          data_type: PointCloud2
          topic: /utlidar/cloud_obstacles
          marking: True
          clearing: False
          # Marks land in map: AMCL's yaw error smears far ones
          obstacle_range: 6.0
          filter: "passthrough"
          min_obstacle_height: -10.0
          max_obstacle_height: 10.0
          expected_update_rate: 1.0
          observation_persistence: 0.0
          inf_is_valid: False
          voxel_min_points: 0
          clear_after_reading: True
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 0.45
      always_send_full_costmap: True

map_saver:
  ros__parameters:
    save_map_timeout: 5.0
    free_thresh_default: 0.25
    occupied_thresh_default: 0.65
    map_subscribe_transient_local: True

planner_server:
  ros__parameters:
    expected_planner_frequency: 20.0
    planner_plugins: ["GridBased"]
    costmap_update_timeout: 1.0
    GridBased:
      plugin: "nav2_navfn_planner::NavfnPlanner"
      tolerance: 0.5
      use_astar: false
      allow_unknown: true

smoother_server:
  ros__parameters:
    smoother_plugins: ["simple_smoother"]
    simple_smoother:
      plugin: "nav2_smoother::SimpleSmoother"
      tolerance: 1.0e-10
      max_its: 1000
      do_refinement: True

behavior_server:
  ros__parameters:
    local_costmap_topic: local_costmap/costmap_raw
    global_costmap_topic: global_costmap/costmap_raw
    local_footprint_topic: local_costmap/published_footprint
    global_footprint_topic: global_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: ["spin", "backup", "drive_on_heading", "assisted_teleop", "wait"]
    spin:
      plugin: "nav2_behaviors::Spin"
    backup:
      plugin: "nav2_behaviors::BackUp"
    drive_on_heading:
      plugin: "nav2_behaviors::DriveOnHeading"
    wait:
      plugin: "nav2_behaviors::Wait"
    assisted_teleop:
      plugin: "nav2_behaviors::AssistedTeleop"
    # Safety teleop: goaway_quadruped_controller holds an assisted_teleop goal while paused; the
    # output skips cmd_vel_nav, so it is a teleop input, not a nav2 one. Flags /teleop_obstacle.
    cmd_vel_teleop: /safety_quadruped_cmd_vel_ui
    cmd_vel_teleop_out: /quadruped_cmd_vel_teleop
    cmd_vel_teleop_timeout: 1.0       # UI repeats at 4 Hz
    projection_time: 1.0
    simulation_time_step: 0.02        # under one cell at full speed, so nothing slips between steps
    min_projection_distance: 0.15
    stop_on_collision: true
    local_frame: odom
    global_frame: map
    robot_base_frame: base_footprint
    transform_tolerance: 0.1
    simulate_ahead_time: 2.0
    max_rotational_vel: 0.4
    min_rotational_vel: 0.1
    rotational_acc_lim: 3.2

waypoint_follower:
  ros__parameters:
    loop_rate: 20
    stop_on_failure: false
    action_server_result_timeout: 900.0
    waypoint_task_executor_plugin: "wait_at_waypoint"
    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      enabled: True
      waypoint_pause_duration: 200

route_server:
  ros__parameters:
    boundary_radius_to_achieve_node: 1.0
    radius_to_achieve_node: 2.0
    smooth_corners: true
    operations: ["AdjustSpeedLimit", "ReroutingService", "CollisionMonitor"]
    ReroutingService:
      plugin: "nav2_route::ReroutingService"
    AdjustSpeedLimit:
      plugin: "nav2_route::AdjustSpeedLimit"
    CollisionMonitor:
      plugin: "nav2_route::CollisionMonitor"
      max_collision_dist: 3.0
    edge_cost_functions: ["DistanceScorer", "CostmapScorer"]
    DistanceScorer:
      plugin: "nav2_route::DistanceScorer"
    CostmapScorer:
      plugin: "nav2_route::CostmapScorer"

velocity_smoother:
  ros__parameters:
    smoothing_frequency: 20.0
    stamp_smoothed_velocity_with_smoothing_time: False
    scale_velocities: False
    feedback: "OPEN_LOOP"
    max_velocity: [0.5, 0.3, 0.8]
    min_velocity: [-0.2, -0.3, -0.8]
    max_accel: [0.3, 0.3, 1.0]
    max_decel: [-1.0, -1.0, -1.0]
    odom_topic: "/odom"               # only used with CLOSED_LOOP
    odom_duration: 0.1
    deadband_velocity: [0.05, 0.05, 0.05]
    velocity_timeout: 1.0

collision_monitor:
  ros__parameters:
    base_frame_id: "base_footprint"
    odom_frame_id: "odom"
    cmd_vel_in_topic: "cmd_vel_smoothed"
    cmd_vel_out_topic: "cmd_vel"
    state_topic: "collision_monitor_state"
    transform_tolerance: 0.2
    source_timeout: 1.0               # scan at 5 Hz
    base_shift_correction: True
    stop_pub_timeout: 2.0
    polygons: ["FootprintApproach"]
    FootprintApproach:
      type: "polygon"
      action_type: "approach"
      footprint_topic: "/local_costmap/published_footprint"
      time_before_collision: 1.2
      simulation_time_step: 0.1
      min_points: 6
      visualize: False
      enabled: True
    # Must publish: a source that never did stops every nav2 command ("invalid source")
    observation_sources: ["scan"]
    scan:
      type: "scan"
      topic: "/utlidar/scan"
      enabled: True

docking_server:
  ros__parameters:
    controller_frequency: 50.0
    initial_perception_timeout: 5.0
    wait_charge_timeout: 5.0
    dock_approach_timeout: 30.0
    undock_linear_tolerance: 0.05
    undock_angular_tolerance: 0.1
    max_retries: 3
    base_frame: "base_footprint"
    fixed_frame: "odom"
    dock_backwards: false
    dock_prestaging_tolerance: 0.5
    dock_plugins: ['simple_charging_dock']
    simple_charging_dock:
      plugin: 'opennav_docking::SimpleChargingDock'
      docking_threshold: 0.05
      staging_x_offset: -0.7
      use_external_detection_pose: true
      use_battery_status: false
      use_stall_detection: false
      external_detection_timeout: 1.0
      external_detection_translation_x: -0.18
      external_detection_translation_y: 0.0
      external_detection_rotation_roll: -1.57
      external_detection_rotation_pitch: -1.57
      external_detection_rotation_yaw: 0.0
      filter_coef: 0.1
    controller:
      k_phi: 3.0
      k_delta: 2.0
      v_linear_min: 0.15
      v_linear_max: 0.15
      use_collision_detection: true
      costmap_topic: "local_costmap/costmap_raw"
      footprint_topic: "local_costmap/published_footprint"
      transform_tolerance: 0.1
      projection_time: 5.0
      simulation_step: 0.1
      dock_collision_threshold: 0.3
