[supervisord]
environment=HOME=/home/htxgrrt

[program:goaway_ws]
command=/bin/bash -i -c  "source /home/htxgrrt/.bashrc && docker compose -f /home/htxgrrt/.htxgrrt/app/goaway_ws/goaway_ws-compose.yaml up"
autostart=true
autorestart=false
user=htxgrrt
redirect_stderr=true
stdout_logfile=/home/htxgrrt/.htxgrrt/logs/goaway_ws.log

[program:goaway_ui]
command=/bin/bash -i -c  "source /home/htxgrrt/.bashrc && docker compose -f /home/htxgrrt/.htxgrrt/app/goaway_ui/goaway_ui-compose.yaml up"
autostart=true
autorestart=true
user=htxgrrt
redirect_stderr=true
stdout_logfile=/home/htxgrrt/.htxgrrt/logs/goaway_ui.log

[program:goaway_lichtblick]
command=/bin/bash -i -c  "source /home/htxgrrt/.bashrc && docker compose -f /home/htxgrrt/.htxgrrt/app/goaway_lichtblick/goaway_lichtblick-compose.yaml up"
autostart=true
autorestart=true
user=htxgrrt
redirect_stderr=true
stdout_logfile=/home/htxgrrt/.htxgrrt/logs/goaway_lichtblick.log

[program:goaway_reboot_manager]
command=/bin/bash -i -c  "source /home/htxgrrt/.bashrc && python3 /home/htxgrrt/.htxgrrt/app/goaway_ws/reboot_manager.py"
autostart=true
autorestart=true
user=htxgrrt
redirect_stderr=true
stdout_logfile=/home/htxgrrt/.htxgrrt/logs/goaway_reboot_manager.log

[group:quadruped]
programs=goaway_ws, goaway_ui, goaway_lichtblick, goaway_reboot_manager